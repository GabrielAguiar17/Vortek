<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 48" fill="none">
  <defs>
    <linearGradient id="vgrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#7ab8ff"/>
      <stop offset="100%" stop-color="#4F8EF7"/>
    </linearGradient>
    <filter id="lglow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- V icon: outer left stroke -->
  <polyline points="2,6 18,38 24,26 18,14" fill="none" stroke="url(#vgrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#lglow)"/>
  <!-- V icon: inner V -->
  <polyline points="12,6 28,38 44,6" fill="none" stroke="url(#vgrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#lglow)"/>
  <!-- Arrow tip top-right -->
  <polyline points="36,6 44,6 44,14" fill="none" stroke="#4F8EF7" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Divider line -->
  <line x1="60" y1="8" x2="60" y2="40" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>

  <!-- VORTEK text -->
  <text x="72" y="29" font-family="'Inter', 'Arial', sans-serif" font-size="18" font-weight="800" letter-spacing="3" fill="#ffffff">VORTEK</text>

  <!-- TECNOLOGIA subtext -->
  <text x="73" y="41" font-family="'Inter', 'Arial', sans-serif" font-size="7" font-weight="400" letter-spacing="4" fill="rgba(255,255,255,0.45)">TECNOLOGIA</text>
</svg>
