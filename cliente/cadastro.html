<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Criar conta — Área do Cliente | Vortek</title>
  <meta name="robots" content="noindex, nofollow"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--bg:#050810;--surface:#0a1222;--border:rgba(79,142,247,.15);--blue:#4F8EF7;--blue-glow:rgba(79,142,247,.25);--text:#e8edf8;--muted:#7a90b8;--white:#fff}
    body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;position:relative;overflow-x:hidden}
    canvas{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;opacity:.5}
    .box{position:relative;z-index:2;width:100%;max-width:440px}
    .logo{text-align:center;margin-bottom:28px}.logo img{height:36px;width:auto}.logo p{font-size:.8rem;color:var(--muted);margin-top:8px;letter-spacing:.08em}
    .card{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:36px 40px;position:relative;overflow:hidden}
    .card:before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--blue),transparent)}
    h1{font-size:1.4rem;font-weight:800;color:var(--white);margin-bottom:6px}.subtitle{font-size:.85rem;color:var(--muted);margin-bottom:24px;line-height:1.5}
    .group{display:flex;flex-direction:column;gap:6px;margin-bottom:15px}label{font-size:.78rem;font-weight:600;color:var(--muted);letter-spacing:.04em}
    input{background:rgba(0,0,0,.3);border:1px solid var(--border);border-radius:9px;padding:13px 15px;color:var(--text);font-size:.9rem;font-family:inherit;outline:none;transition:border-color .2s;width:100%}
    input:focus{border-color:rgba(79,142,247,.6)}input::placeholder{color:rgba(122,144,184,.4)}
    .hint{font-size:.72rem;color:var(--muted);margin-top:1px}
    .message{display:none;border-radius:8px;padding:10px 14px;font-size:.82rem;margin-bottom:16px;line-height:1.45}
    .message.show{display:block}.message.error{background:rgba(224,85,85,.1);border:1px solid rgba(224,85,85,.3);color:#e07070}.message.ok{background:rgba(66,180,120,.1);border:1px solid rgba(66,180,120,.3);color:#78d99c}
    .btn{width:100%;padding:14px;background:var(--blue);color:#fff;border:0;border-radius:9px;font-size:.95rem;font-weight:700;cursor:pointer;box-shadow:0 0 24px var(--blue-glow);transition:all .25s;margin-top:6px}
    .btn:hover{background:#6aa0ff;transform:translateY(-1px)}.btn:disabled{opacity:.6;cursor:not-allowed;transform:none}
    .switch{text-align:center;margin-top:22px;padding-top:18px;border-top:1px solid var(--border);font-size:.82rem;color:var(--muted)}
    a{color:var(--blue);text-decoration:none}a:hover{opacity:.82}.back{text-align:center;margin-top:18px;font-size:.82rem;color:var(--muted)}
    @media(max-width:480px){.card{padding:30px 24px}}
  </style>
<script>
    if (window.location.hostname === 'gabrielaguiar17.github.io') {
      const path = window.location.pathname.replace(/^\/Vortek(?=\/|$)/, '') || '/cliente/login.html';
      window.location.replace(`https://vortek-production-d724da53.up.railway.app${path}${window.location.search}${window.location.hash}`);
    }
  </script>
</head>
<body>
  <canvas id="cv"></canvas>
  <main class="box">
    <div class="logo"><img src="../logo.svg" alt="Vortek"/><p>ÁREA DO CLIENTE</p></div>
    <section class="card">
      <h1>Crie sua conta</h1>
      <p class="subtitle">Cadastre-se para acessar a área do cliente Vortek.</p>
      <div class="message error" id="error-msg" role="alert"></div>
      <div class="message ok" id="success-msg" role="status"></div>
      <form id="register-form">
        <div class="group"><label for="nome">Nome completo</label><input id="nome" name="nome" type="text" placeholder="Seu nome" required minlength="2" maxlength="100" autocomplete="name"/></div>
        <div class="group"><label for="email">E-mail</label><input id="email" name="email" type="email" placeholder="seu@email.com" required maxlength="254" autocomplete="email"/></div>
        <div class="group"><label for="telefone">Telefone <span>(opcional)</span></label><input id="telefone" name="telefone" type="tel" placeholder="(00) 00000-0000" maxlength="30" autocomplete="tel"/></div>
        <div class="group"><label for="senha">Senha</label><input id="senha" name="senha" type="password" placeholder="Mínimo de 8 caracteres" required minlength="8" maxlength="72" autocomplete="new-password"/><span class="hint">Use pelo menos 8 caracteres.</span></div>
        <div class="group"><label for="confirmar-senha">Confirme sua senha</label><input id="confirmar-senha" name="confirmar_senha" type="password" placeholder="Digite a senha novamente" required minlength="8" maxlength="72" autocomplete="new-password"/></div>
        <button class="btn" id="btn-register" type="submit">Criar conta</button>
      </form>
      <p class="switch">Já tem uma conta? <a href="login.html">Entrar</a></p>
    </section>
    <p class="back"><a href="../index.html">← Voltar ao site</a></p>
  </main>
  <script>
    (function(){
      const cv=document.getElementById('cv'),ctx=cv.getContext('2d');let W,H,pts;
      function resize(){W=cv.width=window.innerWidth;H=cv.height=window.innerHeight}
      function mkPt(){return{x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.15,vy:(Math.random()-.5)*.15,r:Math.random()*1.8+.6,a:Math.random()*.5+.2}}
      function init(){resize();pts=Array.from({length:70},mkPt)}
      function draw(){ctx.clearRect(0,0,W,H);for(let i=0;i<pts.length;i++)for(let j=i+1;j<pts.length;j++){const p=pts[i],q=pts[j],d=Math.hypot(p.x-q.x,p.y-q.y);if(d<120){ctx.beginPath();ctx.strokeStyle=`rgba(79,142,247,${(1-d/120)*.2})`;ctx.lineWidth=.5;ctx.moveTo(p.x,p.y);ctx.lineTo(q.x,q.y);ctx.stroke()}}pts.forEach(p=>{ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fillStyle=`rgba(79,142,247,${p.a})`;ctx.fill()})}
      function update(){pts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;if(p.x<0)p.x=W;if(p.x>W)p.x=0;if(p.y<0)p.y=H;if(p.y>H)p.y=0})}
      function loop(){update();draw();requestAnimationFrame(loop)}
      window.addEventListener('resize',resize);init();loop();
    })();
    document.getElementById('register-form').addEventListener('submit',async e=>{
      e.preventDefault();
      const form=e.currentTarget,btn=document.getElementById('btn-register'),err=document.getElementById('error-msg'),ok=document.getElementById('success-msg');
      err.classList.remove('show');ok.classList.remove('show');
      const nome=document.getElementById('nome').value.trim(),email=document.getElementById('email').value.trim(),telefone=document.getElementById('telefone').value.trim(),senha=document.getElementById('senha').value,confirmar_senha=document.getElementById('confirmar-senha').value;
      if(senha!==confirmar_senha){err.textContent='As senhas não coincidem.';err.classList.add('show');return}
      btn.disabled=true;btn.textContent='Criando conta...';
      try{
        const res=await fetch('https://vortek-production-d724da53.up.railway.app/api/auth/register',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'include',body:JSON.stringify({nome,email,telefone,senha,confirmar_senha})});
        const data=await res.json();
        if(!res.ok||!data.token){err.textContent=data.message||(res.ok?'Não foi possível iniciar sua sessão. Tente novamente.':'Não foi possível criar sua conta.');err.classList.add('show');btn.disabled=false;btn.textContent='Criar conta';return}
        sessionStorage.setItem('vortek_access_token',data.token);
        ok.textContent='Conta criada! Abrindo sua área do cliente...';ok.classList.add('show');
        window.setTimeout(()=>{window.location.href=new URL('pages/dashboard.html',window.location.href).href},500);
      }catch{err.textContent='Erro de conexão. Tente novamente.';err.classList.add('show');btn.disabled=false;btn.textContent='Criar conta'}
    });
  </script>
</body>
</html>
