<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Arquivos — Área do Cliente | Vortek</title>
  <meta name="robots" content="noindex, nofollow"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="../painel.css"/>
  <style>
    .filtro-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px 24px;
      border-bottom: 1px solid var(--border);
    }

    .filtro-bar label {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--muted);
      white-space: nowrap;
    }

    .filtro-bar select {
      background: rgba(0,0,0,0.3);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 12px;
      color: var(--text);
      font-family: inherit;
      font-size: 0.85rem;
      outline: none;
      cursor: pointer;
      transition: border-color 0.2s;
      min-width: 180px;
    }
    .filtro-bar select:focus { border-color: rgba(79,142,247,0.4); }
    .filtro-bar select option { background: var(--surface); }

    .arquivo-projeto {
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: 2px;
    }

    .arquivo-data {
      font-size: 0.75rem;
      color: var(--muted);
      margin-right: 16px;
      white-space: nowrap;
    }

    .arquivo-meta {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 2px;
    }

    .arquivos-list { padding: 0; }

    .arquivo-info { flex: 1; min-width: 0; }
    .arquivo-nome-text {
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--white);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
  </style>
</head>
<body>

  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <img src="../../logo.svg" alt="Vortek"/>
    </div>
    <nav class="sidebar-nav">
      <a href="dashboard.html" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
        Dashboard
      </a>
      <a href="projetos.html" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 01-2 2H4a2 2 0 01-2-2V5a2 2 0 012-2h5l2 3h9a2 2 0 012 2z"/></svg>
        Meus Projetos
      </a>
      <a href="progresso.html" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
        Progresso
      </a>
      <a href="arquivos.html" class="nav-item active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
        Arquivos
      </a>
      <a href="financeiro.html" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/></svg>
        Financeiro
      </a>
      <a href="suporte.html" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
        Suporte
      </a>
      <a href="perfil.html" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        Perfil
      </a>
    </nav>
    <button class="sidebar-logout" id="btn-logout">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      Sair
    </button>
  </aside>

  <!-- MAIN -->
  <div class="main">
    <header class="topbar">
      <button class="menu-toggle" id="menu-toggle">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <div class="topbar-title">Arquivos</div>
      <div class="topbar-user" id="topbar-user">
        <div class="user-avatar" id="user-avatar">?</div>
        <span id="user-name">Carregando...</span>
      </div>
    </header>

    <div class="page-content">
      <div class="page-header">
        <h1>Arquivos</h1>
        <p>Baixe os arquivos disponibilizados pela equipe Vortek para o seu projeto.</p>
      </div>

      <div class="section-card">
        <div class="filtro-bar">
          <label for="filtro-projeto">Filtrar por projeto:</label>
          <select id="filtro-projeto" onchange="filtrarArquivos()">
            <option value="">Todos os projetos</option>
          </select>
        </div>
        <div class="arquivos-list" id="arquivos-list">
          <div class="loading">Carregando arquivos...</div>
        </div>
      </div>
    </div>
  </div>

  <script src="../painel.js"></script>
  <script>
    let todosArquivos = [];

    function formatBytes(bytes) {
      if (!bytes) return '—';
      if (bytes < 1024) return bytes + ' B';
      if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
      return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
    }

    function renderArquivos(lista) {
      const el = document.getElementById('arquivos-list');
      if (!lista.length) {
        el.innerHTML = `<div class="empty-state">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
          <p>Nenhum arquivo disponível.</p>
        </div>`;
        return;
      }
      el.innerHTML = lista.map(a => `
        <div class="arquivo-item">
          <div class="arquivo-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
          </div>
          <div class="arquivo-info">
            <div class="arquivo-nome-text">${a.nome}</div>
            <div class="arquivo-projeto">${a.projeto_nome || '—'}</div>
          </div>
          <div class="arquivo-meta">
            <span class="arquivo-size">${formatBytes(a.tamanho)}</span>
            <span class="arquivo-data">${a.criado_em ? new Date(a.criado_em).toLocaleDateString('pt-BR') : '—'}</span>
          </div>
          <a class="btn-download" href="/api/arquivos/${a.id}/download" download>
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="vertical-align:middle;margin-right:4px"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            Baixar
          </a>
        </div>
      `).join('');
    }

    function filtrarArquivos() {
      const projetoId = document.getElementById('filtro-projeto').value;
      const filtrado = projetoId
        ? todosArquivos.filter(a => String(a.projeto_id) === projetoId)
        : todosArquivos;
      renderArquivos(filtrado);
    }

    async function loadArquivos() {
      const el = document.getElementById('arquivos-list');
      try {
        const res = await fetch('/api/arquivos', { credentials: 'include' });
        if (!res.ok) throw new Error();
        todosArquivos = await res.json();

        // Popula filtro de projetos
        const projetos = [...new Map(
          todosArquivos.filter(a => a.projeto_id).map(a => [a.projeto_id, { id: a.projeto_id, nome: a.projeto_nome }])
        ).values()];

        const select = document.getElementById('filtro-projeto');
        projetos.forEach(p => {
          const opt = document.createElement('option');
          opt.value = p.id;
          opt.textContent = p.nome;
          select.appendChild(opt);
        });

        renderArquivos(todosArquivos);
      } catch (e) {
        el.innerHTML = `<div class="empty-state"><p>Erro ao carregar arquivos.</p></div>`;
        console.error(e);
      }
    }

    loadPage('arquivos').then(loadArquivos);
  </script>
</body>
</html>
