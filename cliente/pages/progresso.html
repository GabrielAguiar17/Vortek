<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Progresso — Área do Cliente | Vortek</title>
  <meta name="robots" content="noindex, nofollow"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="../painel.css"/>
  <style>
    .progresso-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }

    .progresso-card-header {
      padding: 24px;
      border-bottom: 1px solid var(--border);
    }

    .progresso-card-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 16px;
    }

    .progresso-card-nome {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--white);
      margin-bottom: 4px;
    }

    .progresso-card-tipo {
      font-size: 0.78rem;
      color: var(--muted);
    }

    .progresso-big-bar {
      flex: 1;
      max-width: 340px;
    }

    .progresso-big-label {
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .progresso-big-label strong {
      font-size: 1rem;
      font-weight: 800;
      color: var(--blue);
    }

    .progress-bar-big {
      height: 10px;
      background: rgba(255,255,255,0.08);
      border-radius: 5px;
      overflow: hidden;
    }

    .progress-bar-big .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--blue), #6aa0ff);
      border-radius: 5px;
      transition: width 0.8s ease;
    }

    /* Timeline */
    .timeline {
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    .timeline-item {
      display: flex;
      gap: 16px;
      position: relative;
    }

    .timeline-left {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 24px;
      flex-shrink: 0;
    }

    .timeline-dot {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: 2px solid var(--blue);
      background: var(--surface);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      z-index: 1;
    }

    .timeline-dot.done {
      background: var(--green);
      border-color: var(--green);
    }

    .timeline-dot.done svg { display: block; }
    .timeline-dot svg {
      display: none;
      width: 10px; height: 10px;
      color: #fff;
      stroke-width: 3;
    }

    .timeline-line {
      flex: 1;
      width: 2px;
      background: var(--border);
      margin: 2px 0;
    }

    .timeline-item:last-child .timeline-line {
      display: none;
    }

    .timeline-content {
      padding-bottom: 24px;
      flex: 1;
    }

    .timeline-item:last-child .timeline-content {
      padding-bottom: 0;
    }

    .timeline-nome {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--white);
      line-height: 1;
      padding-top: 1px;
    }

    .timeline-nome.done {
      color: var(--muted);
    }

    .timeline-status {
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: 4px;
    }

    .timeline-status.done { color: var(--green); }

    .progresso-cards-wrap {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
  </style>
</head>
<body>

  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <img src="../../logo.svg" alt="Vortek"/>
    </div>
    <nav class="sidebar-nav">
      <a href="dashboard.html" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
        Dashboard
      </a>
      <a href="projetos.html" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 01-2 2H4a2 2 0 01-2-2V5a2 2 0 012-2h5l2 3h9a2 2 0 012 2z"/></svg>
        Meus Projetos
      </a>
      <a href="progresso.html" class="nav-item active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
        Progresso
      </a>
      <a href="arquivos.html" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
        Arquivos
      </a>
      <a href="financeiro.html" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/></svg>
        Financeiro
      </a>
      <a href="suporte.html" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
        Suporte
      </a>
      <a href="perfil.html" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        Perfil
      </a>
    </nav>
    <button class="sidebar-logout" id="btn-logout">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      Sair
    </button>
  </aside>

  <!-- MAIN -->
  <div class="main">
    <header class="topbar">
      <button class="menu-toggle" id="menu-toggle">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <div class="topbar-title">Progresso</div>
      <div class="topbar-user" id="topbar-user">
        <div class="user-avatar" id="user-avatar">?</div>
        <span id="user-name">Carregando...</span>
      </div>
    </header>

    <div class="page-content">
      <div class="page-header">
        <h1>Progresso</h1>
        <p>Acompanhe a timeline detalhada de cada projeto ativo.</p>
      </div>

      <div class="progresso-cards-wrap" id="progresso-wrap">
        <div class="loading">Carregando projetos...</div>
      </div>
    </div>
  </div>

  <script src="../painel.js"></script>
  <script>
    async function loadProgresso() {
      const wrap = document.getElementById('progresso-wrap');
      try {
        const res = await fetch('/api/projetos', { credentials: 'include' });
        if (!res.ok) throw new Error();
        const projetos = await res.json();

        if (!projetos.length) {
          wrap.innerHTML = `<div class="empty-state">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
            <p>Nenhum projeto ativo no momento.</p>
          </div>`;
          return;
        }

        // Carrega etapas de cada projeto em paralelo
        const detalhes = await Promise.all(
          projetos.map(p =>
            fetch(`/api/projetos/${p.id}`, { credentials: 'include' })
              .then(r => r.ok ? r.json() : { ...p, etapas: [] })
              .catch(() => ({ ...p, etapas: [] }))
          )
        );

        wrap.innerHTML = detalhes.map(p => {
          const etapas = p.etapas || [];
          const timeline = etapas.length
            ? etapas.map(e => `
              <div class="timeline-item">
                <div class="timeline-left">
                  <div class="timeline-dot ${e.concluida ? 'done' : ''}">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><polyline points="20 6 9 17 4 12"/></svg>
                  </div>
                  <div class="timeline-line"></div>
                </div>
                <div class="timeline-content">
                  <div class="timeline-nome ${e.concluida ? 'done' : ''}">${e.nome}</div>
                  <div class="timeline-status ${e.concluida ? 'done' : ''}">${e.concluida ? 'Concluída' : 'Pendente'}</div>
                </div>
              </div>
            `).join('')
            : `<div class="loading" style="padding:16px 0">Nenhuma etapa cadastrada.</div>`;

          return `
            <div class="progresso-card">
              <div class="progresso-card-header">
                <div class="progresso-card-top">
                  <div>
                    <div class="progresso-card-nome">${p.nome}</div>
                    <div class="progresso-card-tipo">${p.tipo || ''}</div>
                  </div>
                  <div class="progresso-big-bar">
                    <div class="progresso-big-label">
                      <span>Progresso geral</span>
                      <strong>${p.progresso || 0}% concluído</strong>
                    </div>
                    <div class="progress-bar-big">
                      <div class="progress-fill" style="width:${p.progresso || 0}%"></div>
                    </div>
                  </div>
                </div>
              </div>
              <div class="timeline">${timeline}</div>
            </div>
          `;
        }).join('');
      } catch (e) {
        wrap.innerHTML = `<div class="empty-state"><p>Erro ao carregar progresso.</p></div>`;
        console.error(e);
      }
    }

    loadPage('progresso').then(loadProgresso);
  </script>
</body>
</html>
