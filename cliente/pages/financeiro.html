<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Financeiro — Área do Cliente | Vortek</title>
  <meta name="robots" content="noindex, nofollow"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="../painel.css"/>
  <style>
    .fin-resumo {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .fin-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .fin-card-icon {
      width: 48px; height: 48px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .fin-card-icon svg { width: 22px; height: 22px; }
    .fin-card-icon.green { background: rgba(34,197,94,0.1); color: var(--green); border: 1px solid rgba(34,197,94,0.2); }
    .fin-card-icon.yellow { background: rgba(245,158,11,0.1); color: var(--yellow); border: 1px solid rgba(245,158,11,0.2); }

    .fin-card-valor {
      font-size: 1.6rem;
      font-weight: 800;
      color: var(--white);
      line-height: 1;
    }

    .fin-card-label {
      font-size: 0.8rem;
      color: var(--muted);
      margin-top: 5px;
    }

    @media (max-width: 600px) {
      .fin-resumo { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <img src="../../logo.svg" alt="Vortek"/>
    </div>
    <nav class="sidebar-nav">
      <a href="dashboard.html" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
        Dashboard
      </a>
      <a href="projetos.html" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 01-2 2H4a2 2 0 01-2-2V5a2 2 0 012-2h5l2 3h9a2 2 0 012 2z"/></svg>
        Meus Projetos
      </a>
      <a href="progresso.html" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
        Progresso
      </a>
      <a href="arquivos.html" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
        Arquivos
      </a>
      <a href="financeiro.html" class="nav-item active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/></svg>
        Financeiro
      </a>
      <a href="suporte.html" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>

      </a>
      <a href="perfil.html" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        Perfil
      </a>
    </nav>
    <button class="sidebar-logout" id="btn-logout">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      Sair
    </button>
  </aside>

  <!-- MAIN -->
  <div class="main">
    <header class="topbar">
      <button class="menu-toggle" id="menu-toggle">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <div class="topbar-title">Financeiro</div>
      <div class="topbar-user" id="topbar-user">
        <div class="user-avatar" id="user-avatar">?</div>
        <span id="user-name">Carregando...</span>
      </div>
    </header>

    <div class="page-content">
      <div class="page-header">
        <h1>Financeiro</h1>
        <p>Visualize suas cobranças e histórico de pagamentos.</p>
      </div>

      <!-- Resumo -->
      <div class="fin-resumo">
        <div class="fin-card">
          <div class="fin-card-icon green">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 11-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
          </div>
          <div>
            <div class="fin-card-valor" id="total-pago">R$ —</div>
            <div class="fin-card-label">Total pago</div>
          </div>
        </div>
        <div class="fin-card">
          <div class="fin-card-icon yellow">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
          </div>
          <div>
            <div class="fin-card-valor" id="total-pendente">R$ —</div>
            <div class="fin-card-label">Total pendente</div>
          </div>
        </div>
      </div>

      <!-- Tabela -->
      <div class="section-card">
        <div class="section-card-header">
          <h2>Cobranças</h2>
        </div>
        <div class="tabela-wrap">
          <table>
            <thead>
              <tr>
                <th>Descrição</th>
                <th>Projeto</th>
                <th>Valor</th>
                <th>Vencimento</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody id="financeiro-tbody">
              <tr><td colspan="5" class="loading">Carregando cobranças...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script src="../painel.js"></script>
  <script>
    function formatBRL(value) {
      if (value == null) return 'R$ —';
      return new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(value);
    }

    function statusClass(status) {
      const s = (status || '').toLowerCase();
      if (s === 'pago') return 'pago';
      if (s === 'vencido') return 'vencido';
      return 'pendente';
    }

    async function loadFinanceiro() {
      const tbody = document.getElementById('financeiro-tbody');
      try {
        const res = await fetch('https://vorteksystems.up.railway.app/api/financeiro', {
          credentials: 'include' });
        if (!res.ok) throw new Error();
        const data = await res.json();
        const cobrancas = data.cobrancas || data;

        // Totais
        let pago = 0, pendente = 0;
        cobrancas.forEach(c => {
          const s = (c.status || '').toLowerCase();
          if (s === 'pago') pago += Number(c.valor) || 0;
          else pendente += Number(c.valor) || 0;
        });
        document.getElementById('total-pago').textContent = formatBRL(pago);
        document.getElementById('total-pendente').textContent = formatBRL(pendente);

        if (!cobrancas.length) {
          tbody.innerHTML = `<tr><td colspan="5" class="loading">Nenhuma cobrança encontrada.</td></tr>`;
          return;
        }

        tbody.innerHTML = cobrancas.map(c => `
          <tr>
            <td>${c.descricao || '—'}</td>
            <td>${c.projeto_nome || '—'}</td>
            <td>${formatBRL(c.valor)}</td>
            <td>${c.vencimento ? new Date(c.vencimento).toLocaleDateString('pt-BR') : '—'}</td>
            <td><span class="${statusClass(c.status)}">${c.status || '—'}</span></td>
          </tr>
        `).join('');
      } catch (e) {
        tbody.innerHTML = `<tr><td colspan="5" class="loading">Erro ao carregar cobranças.</td></tr>`;
        console.error(e);
      }
    }

    loadPage('financeiro').then(loadFinanceiro);
  </script>
</body>
</html>
