<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Perfil — Área do Cliente | Vortek</title>
  <meta name="robots" content="noindex, nofollow"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="../painel.css"/>
  <style>
    .perfil-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      align-items: start;
    }

    @media (max-width: 860px) {
      .perfil-grid { grid-template-columns: 1fr; }
    }

    .alert {
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 500;
      display: none;
    }
    .alert.success { background: rgba(34,197,94,0.1); color: var(--green); border: 1px solid rgba(34,197,94,0.2); display: block; }
    .alert.error   { background: rgba(224,85,85,0.1);  color: var(--red);   border: 1px solid rgba(224,85,85,0.2);  display: block; }

    .btn-primary:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .perfil-avatar-wrap {
      padding: 24px;
      display: flex;
      align-items: center;
      gap: 16px;
      border-bottom: 1px solid var(--border);
    }

    .perfil-avatar-big {
      width: 56px; height: 56px;
      background: rgba(79,142,247,0.15);
      border: 2px solid rgba(79,142,247,0.3);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.3rem;
      font-weight: 800;
      color: var(--blue);
      flex-shrink: 0;
    }

    .perfil-email {
      font-size: 0.8rem;
      color: var(--muted);
      margin-top: 2px;
    }

    .perfil-nome-display {
      font-size: 1rem;
      font-weight: 700;
      color: var(--white);
    }
  </style>
</head>
<body>

  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <img src="../../logo.svg" alt="Vortek"/>
    </div>
    <nav class="sidebar-nav">
      <a href="dashboard.html" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
        Dashboard
      </a>
      <a href="projetos.html" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 01-2 2H4a2 2 0 01-2-2V5a2 2 0 012-2h5l2 3h9a2 2 0 012 2z"/></svg>
        Meus Projetos
      </a>
      <a href="progresso.html" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
        Progresso
      </a>
      <a href="arquivos.html" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
        Arquivos
      </a>
      <a href="financeiro.html" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/></svg>
        Financeiro
      </a>
      <a href="suporte.html" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
        Suporte
      </a>
      <a href="perfil.html" class="nav-item active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        Perfil
      </a>
    </nav>
    <button class="sidebar-logout" id="btn-logout">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      Sair
    </button>
  </aside>

  <!-- MAIN -->
  <div class="main">
    <header class="topbar">
      <button class="menu-toggle" id="menu-toggle">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <div class="topbar-title">Perfil</div>
      <div class="topbar-user" id="topbar-user">
        <div class="user-avatar" id="user-avatar">?</div>
        <span id="user-name">Carregando...</span>
      </div>
    </header>

    <div class="page-content">
      <div class="page-header">
        <h1>Perfil</h1>
        <p>Gerencie seus dados pessoais e senha de acesso.</p>
      </div>

      <div class="perfil-grid">

        <!-- Dados pessoais -->
        <div class="section-card">
          <div class="perfil-avatar-wrap">
            <div class="perfil-avatar-big" id="perfil-avatar-big">?</div>
            <div>
              <div class="perfil-nome-display" id="perfil-nome-display">—</div>
              <div class="perfil-email" id="perfil-email">—</div>
            </div>
          </div>
          <div class="section-card-header">
            <h2>Dados pessoais</h2>
          </div>
          <form class="painel-form" id="form-dados" onsubmit="salvarDados(event)">
            <div id="dados-alert"></div>
            <div class="form-group">
              <label for="perfil-nome">Nome completo</label>
              <input type="text" id="perfil-nome" placeholder="Seu nome completo" required/>
            </div>
            <div class="form-group">
              <label for="perfil-telefone">Telefone</label>
              <input type="tel" id="perfil-telefone" placeholder="(00) 00000-0000"/>
            </div>
            <button type="submit" class="btn-primary" id="btn-dados">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
              Salvar dados
            </button>
          </form>
        </div>

        <!-- Alterar senha -->
        <div class="section-card">
          <div class="section-card-header">
            <h2>Alterar senha</h2>
          </div>
          <form class="painel-form" id="form-senha" onsubmit="salvarSenha(event)">
            <div id="senha-alert"></div>
            <div class="form-group">
              <label for="senha-atual">Senha atual</label>
              <input type="password" id="senha-atual" placeholder="Digite sua senha atual" required/>
            </div>
            <div class="form-group">
              <label for="senha-nova">Nova senha</label>
              <input type="password" id="senha-nova" placeholder="Mínimo 8 caracteres" required minlength="8"/>
            </div>
            <div class="form-group">
              <label for="senha-confirmar">Confirmar nova senha</label>
              <input type="password" id="senha-confirmar" placeholder="Repita a nova senha" required minlength="8"/>
            </div>
            <button type="submit" class="btn-primary" id="btn-senha">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
              Alterar senha
            </button>
          </form>
        </div>

      </div>
    </div>
  </div>

  <script src="../painel.js"></script>
  <script>
    function showAlert(elId, type, msg) {
      const el = document.getElementById(elId);
      el.className = `alert ${type}`;
      el.textContent = msg;
      setTimeout(() => { el.className = 'alert'; el.textContent = ''; }, 5000);
    }

    async function loadPerfil() {
      try {
        const res = await fetch('https://vortek-production-d724da53.up.railway.app/api/perfil', {
          credentials: 'include' });
        if (!res.ok) throw new Error();
        const perfil = await res.json();

        document.getElementById('perfil-nome').value = perfil.nome || '';
        document.getElementById('perfil-telefone').value = perfil.telefone || '';
        document.getElementById('perfil-email').textContent = perfil.email || '—';
        document.getElementById('perfil-nome-display').textContent = perfil.nome || '—';

        const inicial = (perfil.nome || '?')[0].toUpperCase();
        document.getElementById('perfil-avatar-big').textContent = inicial;
      } catch (e) {
        console.error('Erro ao carregar perfil:', e);
      }
    }

    async function salvarDados(e) {
      e.preventDefault();
      const btn = document.getElementById('btn-dados');
      btn.disabled = true;
      btn.textContent = 'Salvando...';

      const nome = document.getElementById('perfil-nome').value.trim();
      const telefone = document.getElementById('perfil-telefone').value.trim();

      try {
        const res = await fetch('https://vortek-production-d724da53.up.railway.app/api/perfil', {
          credentials: 'include',
          method: 'PUT',
          credentials: 'include',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ nome, telefone }),
        });

        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          throw new Error(err.message || 'Erro ao salvar');
        }

        document.getElementById('perfil-nome-display').textContent = nome;
        document.getElementById('perfil-avatar-big').textContent = nome[0]?.toUpperCase() || '?';
        document.getElementById('user-name').textContent = nome;
        document.getElementById('user-avatar').textContent = nome[0]?.toUpperCase() || '?';

        showAlert('dados-alert', 'success', 'Dados atualizados com sucesso!');
      } catch (err) {
        showAlert('dados-alert', 'error', err.message || 'Erro ao salvar dados.');
      } finally {
        btn.disabled = false;
        btn.innerHTML = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg> Salvar dados`;
      }
    }

    async function salvarSenha(e) {
      e.preventDefault();
      const btn = document.getElementById('btn-senha');
      const nova = document.getElementById('senha-nova').value;
      const confirmar = document.getElementById('senha-confirmar').value;

      if (nova !== confirmar) {
        showAlert('senha-alert', 'error', 'As senhas não coincidem.');
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Salvando...';

      try {
        const res = await fetch('https://vortek-production-d724da53.up.railway.app/api/perfil/senha', {
          credentials: 'include',
          method: 'PUT',
          credentials: 'include',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            senha_atual: document.getElementById('senha-atual').value,
            senha_nova: nova,
          }),
        });

        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          throw new Error(err.message || 'Erro ao alterar senha');
        }

        showAlert('senha-alert', 'success', 'Senha alterada com sucesso!');
        document.getElementById('form-senha').reset();
      } catch (err) {
        showAlert('senha-alert', 'error', err.message || 'Erro ao alterar senha.');
      } finally {
        btn.disabled = false;
        btn.innerHTML = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg> Alterar senha`;
      }
    }

    loadPage('perfil').then(loadPerfil);
  </script>
</body>
</html>
