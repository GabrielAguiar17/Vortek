<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Meus Projetos — Área do Cliente | Vortek</title>
  <meta name="robots" content="noindex, nofollow"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="../painel.css"/>
  <style>
    .projeto-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      transition: border-color 0.2s;
    }
    .projeto-card:hover { border-color: rgba(79,142,247,0.3); }

    .projeto-card-header {
      padding: 20px 24px;
      display: flex;
      align-items: center;
      gap: 16px;
      cursor: pointer;
      user-select: none;
    }

    .projeto-card-info { flex: 1; }
    .projeto-card-nome { font-size: 1rem; font-weight: 700; color: var(--white); margin-bottom: 4px; }
    .projeto-card-meta { font-size: 0.78rem; color: var(--muted); display: flex; gap: 16px; flex-wrap: wrap; margin-top: 8px; }
    .projeto-card-meta span { display: flex; align-items: center; gap: 4px; }

    .projeto-card-progress {
      width: 140px;
      flex-shrink: 0;
    }
    .projeto-card-progress .progress-bar { margin-bottom: 4px; }

    .chevron {
      width: 20px; height: 20px;
      color: var(--muted);
      transition: transform 0.25s ease;
      flex-shrink: 0;
    }
    .projeto-card.expanded .chevron { transform: rotate(180deg); }

    .projeto-etapas {
      display: none;
      border-top: 1px solid var(--border);
      padding: 16px 24px;
      background: rgba(0,0,0,0.2);
    }
    .projeto-card.expanded .projeto-etapas { display: block; }

    .etapa-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 0;
      border-bottom: 1px solid rgba(79,142,247,0.06);
      font-size: 0.875rem;
    }
    .etapa-item:last-child { border-bottom: none; }

    .etapa-check {
      width: 18px; height: 18px;
      border-radius: 50%;
      border: 2px solid var(--border);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .etapa-check.done {
      background: var(--green);
      border-color: var(--green);
    }
    .etapa-check.done svg { display: block; }
    .etapa-check svg {
      display: none;
      width: 10px; height: 10px;
      color: #fff;
      stroke-width: 3;
    }

    .etapa-nome { flex: 1; color: var(--text); }
    .etapa-nome.done { color: var(--muted); text-decoration: line-through; }

    .etapas-loading { font-size: 0.8rem; color: var(--muted); padding: 8px 0; }

    .projetos-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
  </style>
</head>
<body>

  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <img src="../../logo.svg" alt="Vortek"/>
    </div>
    <nav class="sidebar-nav">
      <a href="dashboard.html" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
        Dashboard
      </a>
      <a href="projetos.html" class="nav-item active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 01-2 2H4a2 2 0 01-2-2V5a2 2 0 012-2h5l2 3h9a2 2 0 012 2z"/></svg>
        Meus Projetos
      </a>
      <a href="progresso.html" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
        Progresso
      </a>
      <a href="arquivos.html" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
        Arquivos
      </a>
      <a href="financeiro.html" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/></svg>
        Financeiro
      </a>
      <a href="suporte.html" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
        Suporte
      </a>
      <a href="perfil.html" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        Perfil
      </a>
    </nav>
    <button class="sidebar-logout" id="btn-logout">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      Sair
    </button>
  </aside>

  <!-- MAIN -->
  <div class="main">
    <header class="topbar">
      <button class="menu-toggle" id="menu-toggle">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <div class="topbar-title">Meus Projetos</div>
      <div class="topbar-user" id="topbar-user">
        <div class="user-avatar" id="user-avatar">?</div>
        <span id="user-name">Carregando...</span>
      </div>
    </header>

    <div class="page-content">
      <div class="page-header">
        <h1>Meus Projetos</h1>
        <p>Acompanhe o status e as etapas de cada projeto.</p>
      </div>

      <div class="projetos-grid" id="projetos-grid">
        <div class="loading">Carregando projetos...</div>
      </div>
    </div>
  </div>

  <script src="../painel.js"></script>
  <script>
    async function loadProjetos() {
      const grid = document.getElementById('projetos-grid');
      try {
        const res = await fetch('https://vorteksystems.up.railway.app/api/projetos', {
          credentials: 'include' });
        if (!res.ok) throw new Error('Falha ao buscar projetos');
        const projetos = await res.json();

        if (!projetos.length) {
          grid.innerHTML = `<div class="empty-state">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M22 19a2 2 0 01-2 2H4a2 2 0 01-2-2V5a2 2 0 012-2h5l2 3h9a2 2 0 012 2z"/></svg>
            <p>Nenhum projeto encontrado.</p>
          </div>`;
          return;
        }

        grid.innerHTML = projetos.map(p => `
          <div class="projeto-card" id="card-${p.id}">
            <div class="projeto-card-header" onclick="toggleProjeto(${p.id})">
              <div class="projeto-card-info">
                <div class="projeto-card-nome">${p.nome}</div>
                <div class="projeto-card-meta">
                  <span>
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                    Início: ${p.data_inicio ? new Date(p.data_inicio).toLocaleDateString('pt-BR') : '—'}
                  </span>
                  <span>
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                    Previsão: ${p.data_previsao ? new Date(p.data_previsao).toLocaleDateString('pt-BR') : '—'}
                  </span>
                  <span>${p.tipo || ''}</span>
                </div>
              </div>
              <div class="projeto-card-progress">
                <div class="progress-bar"><div class="progress-fill" style="width:${p.progresso || 0}%"></div></div>
                <div class="progress-label">${p.progresso || 0}% concluído</div>
              </div>
              <span class="status-badge status-${(p.status || '').toLowerCase().replace(/ /g,'-')}">${p.status || ''}</span>
              <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
            </div>
            <div class="projeto-etapas" id="etapas-${p.id}">
              <div class="etapas-loading">Carregando etapas...</div>
            </div>
          </div>
        `).join('');
      } catch (e) {
        grid.innerHTML = `<div class="empty-state"><p>Erro ao carregar projetos.</p></div>`;
        console.error(e);
      }
    }

    async function toggleProjeto(id) {
      const card = document.getElementById(`card-${id}`);
      const etapasEl = document.getElementById(`etapas-${id}`);
      const wasExpanded = card.classList.contains('expanded');

      card.classList.toggle('expanded');

      if (!wasExpanded && etapasEl.dataset.loaded !== 'true') {
        try {
          const res = await fetch(`https://vorteksystems.up.railway.app/api/projetos/${id}`, { credentials: 'include' });
          if (!res.ok) throw new Error();
          const projeto = await res.json();
          const etapas = projeto.etapas || [];

          if (!etapas.length) {
            etapasEl.innerHTML = `<div class="etapas-loading">Nenhuma etapa cadastrada.</div>`;
          } else {
            etapasEl.innerHTML = etapas.map(e => `
              <div class="etapa-item">
                <div class="etapa-check ${e.concluida ? 'done' : ''}">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><polyline points="20 6 9 17 4 12"/></svg>
                </div>
                <span class="etapa-nome ${e.concluida ? 'done' : ''}">${e.nome}</span>
              </div>
            `).join('');
          }
          etapasEl.dataset.loaded = 'true';
        } catch {
          etapasEl.innerHTML = `<div class="etapas-loading">Erro ao carregar etapas.</div>`;
        }
      }
    }

    loadPage('projetos').then(loadProjetos);
  </script>
</body>
</html>
