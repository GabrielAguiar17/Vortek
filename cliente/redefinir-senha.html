<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#050810;color:#e8edf8;font-family:Inter,Arial,sans-serif;padding:20px}.box{width:min(100%,440px);background:#0a1222;border:1px solid rgba(79,142,247,.2);border-radius:18px;padding:32px}img{height:34px;display:block;margin:0 auto 22px}h1{font-size:1.45rem;margin:0 0 8px}p{color:#8799b8;font-size:.9rem;line-height:1.55;margin:0 0 22px}label{display:block;font-size:.8rem;color:#8799b8;font-weight:600;margin:0 0 7px}input{width:100%;padding:13px 14px;border-radius:9px;border:1px solid rgba(79,142,247,.2);background:#07101e;color:#e8edf8;font:inherit;margin-bottom:16px}button{width:100%;padding:13px;border:0;border-radius:9px;background:#4f8ef7;color:#fff;font-weight:700;font:inherit;cursor:pointer}button:disabled{opacity:.65}.message{margin:14px 0 0;padding:11px;border-radius:8px;font-size:.85rem;display:none}.message.show{display:block}.error{background:#321f29;color:#ffa3a3}.success{background:#142c29;color:#91e0b2}.back{display:block;text-align:center;margin-top:20px;color:#4f8ef7;text-decoration:none;font-size:.85rem}</style>
</head><body><main class="box"><img src="../logo.svg" alt="Vortek"/><h1>Crie uma nova senha</h1><p>O link vale por 30 minutos e só pode ser usado uma vez.</p>
<form id="reset-form"><label for="senha">Nova senha (mínimo de 8 caracteres)</label><input id="senha" type="password" autocomplete="new-password" minlength="8" maxlength="72" required/><label for="confirmar">Confirme a nova senha</label><input id="confirmar" type="password" autocomplete="new-password" minlength="8" maxlength="72" required/><button id="submit" type="submit">Redefinir senha</button></form><div id="message" class="message" role="status"></div><a id="back" class="back" href="login.html">Voltar ao login</a></main>
<script>
const form=document.getElementById('reset-form'),msg=document.getElementById('message'),btn=document.getElementById('submit'),token=new URLSearchParams(location.search).get('token')||'';
if(!token){form.hidden=true;msg.textContent='O link está incompleto. Solicite uma nova recuperação.';msg.className='message show error';}
form.addEventListener('submit',async e=>{e.preventDefault();btn.disabled=true;msg.className='message';try{const res=await fetch('/api/auth/reset-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,senha:document.getElementById('senha').value,confirmar_senha:document.getElementById('confirmar').value})});const data=await res.json().catch(()=>({}));if(!res.ok)throw new Error(data.message||'Não foi possível redefinir a senha.');msg.textContent=data.message;msg.className='message show success';form.hidden=true;}catch(err){msg.textContent=err.message;msg.className='message show error';}finally{btn.disabled=false;}});
</script></body></html>
