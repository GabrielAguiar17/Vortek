<script>if(location.hostname==='gabrielaguiar17.github.io'){location.replace('https://vorteksystems.up.railway.app'+location.pathname.replace(/^\/Vortek(?=\/|$)/,'')+location.search+location.hash);}</script>
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#050810;color:#e8edf8;font-family:Inter,Arial,sans-serif;padding:20px}.box{width:min(100%,440px);background:#0a1222;border:1px solid rgba(79,142,247,.2);border-radius:18px;padding:32px}img{height:34px;display:block;margin:0 auto 22px}h1{font-size:1.45rem;margin:0 0 8px}p{color:#8799b8;font-size:.9rem;line-height:1.55;margin:0 0 22px}label{display:block;font-size:.8rem;color:#8799b8;font-weight:600;margin:0 0 7px}input{width:100%;padding:13px 14px;border-radius:9px;border:1px solid rgba(79,142,247,.2);background:#07101e;color:#e8edf8;font:inherit;margin-bottom:16px}button{width:100%;padding:13px;border:0;border-radius:9px;background:#4f8ef7;color:#fff;font-weight:700;font:inherit;cursor:pointer}button:disabled{opacity:.65}.message{margin:14px 0 0;padding:11px;border-radius:8px;font-size:.85rem;display:none}.message.show{display:block}.error{background:#321f29;color:#ffa3a3}.success{background:#142c29;color:#91e0b2}.back{display:block;text-align:center;margin-top:20px;color:#4f8ef7;text-decoration:none;font-size:.85rem}</style>
</head><body><main class="box"><img src="../logo.svg" alt="Vortek"/><h1>Recuperar senha</h1><p>Informe o e-mail da sua conta. Se ela estiver cadastrada, enviaremos um link para criar uma nova senha.</p>
<form id="recover-form"><label for="email">E-mail</label><input id="email" type="email" autocomplete="email" maxlength="254" required/><button id="submit" type="submit">Enviar link de recuperação</button></form><div id="message" class="message" role="status"></div><a class="back" href="login.html">Voltar ao login</a></main>
<script>
const form=document.getElementById('recover-form'),msg=document.getElementById('message'),btn=document.getElementById('submit');
form.addEventListener('submit',async e=>{e.preventDefault();btn.disabled=true;btn.textContent='Enviando…';msg.textContent='Solicitando o envio do link…';msg.className='message show';try{const res=await fetch('/api/auth/forgot-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:document.getElementById('email').value}),signal:AbortSignal.timeout(20000)});const data=await res.json().catch(()=>({}));if(!res.ok)throw new Error(data.message||'Não foi possível enviar agora. Tente novamente mais tarde.');msg.textContent=data.message;msg.className='message show success';}catch(err){msg.textContent=err.name==='TimeoutError'?'O serviço de e-mail demorou para responder. Tente novamente mais tarde.':(err.message||'Falha de conexão. Tente novamente.');msg.className='message show error';}finally{btn.disabled=false;btn.textContent='Enviar link de recuperação';}});
</script></body></html>
