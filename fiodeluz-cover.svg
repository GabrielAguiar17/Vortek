<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="500" height="400">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f5ede0"/>
      <stop offset="100%" stop-color="#ede0cc"/>
    </radialGradient>
    <radialGradient id="ballGrad" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#c8955a"/>
      <stop offset="100%" stop-color="#8b5e2e"/>
    </radialGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="rgba(100,60,20,0.18)"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="500" height="400" fill="url(#bgGrad)" rx="12"/>

  <!-- Outer decorative circle -->
  <circle cx="250" cy="168" r="100" fill="none" stroke="#b8864e" stroke-width="1.2" opacity="0.5"/>

  <!-- Star / sparkle top -->
  <g transform="translate(250, 68)" filter="url(#glow)">
    <line x1="0" y1="-11" x2="0" y2="11" stroke="#c8955a" stroke-width="1.6" stroke-linecap="round"/>
    <line x1="-11" y1="0" x2="11" y2="0" stroke="#c8955a" stroke-width="1.6" stroke-linecap="round"/>
    <line x1="-7" y1="-7" x2="7" y2="7" stroke="#c8955a" stroke-width="0.9" stroke-linecap="round"/>
    <line x1="7" y1="-7" x2="-7" y2="7" stroke="#c8955a" stroke-width="0.9" stroke-linecap="round"/>
  </g>

  <!-- Yarn ball group -->
  <g transform="translate(230, 155)" filter="url(#softShadow)">
    <!-- Main ball -->
    <ellipse cx="10" cy="10" rx="46" ry="44" fill="url(#ballGrad)"/>

    <!-- Yarn texture lines on ball (curved) -->
    <path d="M-20,-15 Q10,5 40,-10" fill="none" stroke="#f0d4b0" stroke-width="1.3" stroke-linecap="round" opacity="0.7"/>
    <path d="M-30,0 Q10,18 42,5" fill="none" stroke="#f0d4b0" stroke-width="1.3" stroke-linecap="round" opacity="0.7"/>
    <path d="M-25,15 Q10,30 40,20" fill="none" stroke="#f0d4b0" stroke-width="1.3" stroke-linecap="round" opacity="0.7"/>
    <path d="M-15,28 Q10,38 36,32" fill="none" stroke="#f0d4b0" stroke-width="1.1" stroke-linecap="round" opacity="0.6"/>
    <path d="M-5,-28 Q12,-10 38,-20" fill="none" stroke="#f0d4b0" stroke-width="1.1" stroke-linecap="round" opacity="0.6"/>

    <path d="M-32,-5 Q-5,15 10,38" fill="none" stroke="#f0d4b0" stroke-width="1.1" stroke-linecap="round" opacity="0.5"/>
    <path d="M-20,-25 Q5,0 20,38" fill="none" stroke="#f0d4b0" stroke-width="1.1" stroke-linecap="round" opacity="0.5"/>
    <path d="M5,-35 Q20,-5 28,38" fill="none" stroke="#f0d4b0" stroke-width="1.0" stroke-linecap="round" opacity="0.4"/>
    <path d="M25,-30 Q35,0 38,30" fill="none" stroke="#f0d4b0" stroke-width="1.0" stroke-linecap="round" opacity="0.4"/>

    <!-- Highlight on ball -->
    <ellipse cx="-8" cy="-5" rx="12" ry="10" fill="rgba(255,235,200,0.22)" transform="rotate(-20,-8,-5)"/>
  </g>

  <!-- Crochet hook -->
  <g transform="translate(276, 118)" fill="none" stroke="#8b5e2e" stroke-linecap="round">
    <!-- Hook shaft -->
    <path d="M18,-38 Q16,10 10,42" stroke-width="4.5" stroke="#a0722a"/>
    <path d="M18,-38 Q16,10 10,42" stroke-width="2.5" stroke="#c8955a"/>
    <!-- Hook curve at top -->
    <path d="M18,-38 Q28,-50 34,-44 Q40,-36 32,-28 Q26,-22 18,-28" stroke-width="3" stroke="#a0722a" fill="none"/>
    <path d="M18,-38 Q28,-50 34,-44 Q40,-36 32,-28 Q26,-22 18,-28" stroke-width="1.8" stroke="#c8a060" fill="none"/>
  </g>

  <!-- Yarn tail coming out of ball with heart -->
  <path d="M278,205 Q310,215 330,220 Q355,226 365,218" fill="none" stroke="#b8864e" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Small heart at end of yarn -->
  <g transform="translate(368, 212)">
    <path d="M0,5 C0,5 -10,-4 -10,-10 C-10,-16 -4,-18 0,-14 C4,-18 10,-16 10,-10 C10,-4 0,5 0,5 Z"
          fill="none" stroke="#b8864e" stroke-width="1.8" stroke-linejoin="round"/>
  </g>

  <!-- ── Typography ── -->
  <!-- "Fio de Luz" -->
  <text x="250" y="298" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
        font-size="46" font-weight="400" fill="#7a4f24" letter-spacing="1" filter="url(#softShadow)">
    <tspan font-style="italic" font-size="50">F</tspan>io de Luz
  </text>

  <!-- Decorative lines around ATELIÊ -->
  <line x1="148" y1="318" x2="192" y2="318" stroke="#b8864e" stroke-width="1.2" opacity="0.7"/>
  <line x1="308" y1="318" x2="352" y2="318" stroke="#b8864e" stroke-width="1.2" opacity="0.7"/>

  <!-- ATELIÊ -->
  <text x="250" y="323" text-anchor="middle" font-family="'Arial', sans-serif"
        font-size="13" font-weight="400" fill="#a07840" letter-spacing="6">ATELIÊ</text>

  <!-- Subtle bottom ornament dots -->
  <circle cx="236" cy="345" r="1.8" fill="#c8955a" opacity="0.5"/>
  <circle cx="250" cy="345" r="1.8" fill="#c8955a" opacity="0.5"/>
  <circle cx="264" cy="345" r="1.8" fill="#c8955a" opacity="0.5"/>
</svg>
