<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <defs>
    <linearGradient id="vg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="45%" stop-color="#90c4ff"/>
      <stop offset="100%" stop-color="#4F8EF7"/>
    </linearGradient>
    <linearGradient id="vg2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4F8EF7"/>
      <stop offset="100%" stop-color="#1a5fd4"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow2" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Soft background glow -->
  <ellipse cx="200" cy="150" rx="130" ry="110" fill="rgba(79,142,247,0.07)" filter="url(#glow2)"/>

  <!-- Grid lines -->
  <line x1="200" y1="0" x2="200" y2="300" stroke="rgba(79,142,247,0.1)" stroke-width="1"/>
  <line x1="0" y1="150" x2="400" y2="150" stroke="rgba(79,142,247,0.1)" stroke-width="1"/>
  <line x1="0" y1="0" x2="400" y2="300" stroke="rgba(79,142,247,0.07)" stroke-width="1"/>
  <line x1="400" y1="0" x2="0" y2="300" stroke="rgba(79,142,247,0.07)" stroke-width="1"/>

  <!-- Concentric circles -->
  <circle cx="200" cy="150" r="130" stroke="rgba(79,142,247,0.12)" stroke-width="1" fill="none"/>
  <circle cx="200" cy="150" r="90"  stroke="rgba(79,142,247,0.16)" stroke-width="1" fill="none"/>
  <circle cx="200" cy="150" r="50"  stroke="rgba(79,142,247,0.1)"  stroke-width="1" fill="none"/>

  <!-- V icon — left outer stroke (white/silver side) -->
  <polyline
    points="80,55  160,230  188,172  140,55"
    fill="none"
    stroke="url(#vg1)"
    stroke-width="22"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#glow)"
  />

  <!-- V icon — right inner V (blue side) -->
  <polyline
    points="130,55  210,230  320,55"
    fill="none"
    stroke="url(#vg2)"
    stroke-width="22"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#glow)"
  />

  <!-- Arrow notch top-right -->
  <polyline
    points="285,55  320,55  320,90"
    fill="none"
    stroke="#4F8EF7"
    stroke-width="16"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#glow)"
  />

  <!-- Center dot -->
  <circle cx="200" cy="150" r="4" fill="#4F8EF7" opacity="0.6"/>
</svg>
